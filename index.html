<script>
'use strict';
const APP_VERSION='2.0.7.2';
const CONFIG=Object.freeze({
  minAnsweredPerDimension:3,
  similarPriorityTolerance:5,
  weakInteractionBoundary:50,
  establishedInteractionBoundary:65,
  directionalDifference:10,
  valueBaseBoundaries:Object.freeze({weak:35,developing:60,strong:80}),
  scale:Object.freeze([
    'The condition is absent, obstructed, or unmanaged.',
    'The condition is isolated, informal, or highly inconsistent.',
    'The condition is partially established but uneven.',
    'The condition is consistently implemented for the selected scope.',
    'The condition is integrated, measured, and continuously improving.'
  ])
});
const LEVEL_LABELS=Object.freeze(['0 — Not in place','1 — Isolated','2 — Partly established','3 — Established','4 — Embedded']);
const FINDING_LEVELS=Object.freeze(['not in place','isolated and informal','partly established but uneven','established for the selected scope','embedded and improving']);
const DIMENSIONS=Object.freeze([
 {id:'culture',label:'Culture & people',academic:'Cultural alignment',color:'var(--culture)',hex:'#315b8a',desc:'Whether employees can experiment, participate, raise concerns, and learn from AI use in a safe and constructive environment.'},
 {id:'expectations',label:'Expectations & AI skills',academic:'Expectation–capability dynamics',color:'var(--expect)',hex:'#765a9a',desc:'Whether expectations are realistic and employees have the skills and judgement needed to use and review AI effectively.'},
 {id:'leadership',label:'Leadership',academic:'Leadership engagement',color:'var(--lead)',hex:'#2c7894',desc:'Whether leaders provide direction, resources, business ownership, and clear responsibility for implementation.'},
 {id:'structure',label:'Data, systems & processes',academic:'Structural enablement',color:'var(--struct)',hex:'#656b78',desc:'Whether data, governance, systems, workflows, ownership, and coordination support dependable operational use.'}
]);
const DIM=Object.freeze(Object.fromEntries(DIMENSIONS.map(d=>[d.id,d])));
const DIM_ORDER=Object.freeze(DIMENSIONS.map(d=>d.id));
const QUESTIONS = [
// ---------- CULTURAL ALIGNMENT ----------
{
  id: 'C1',
  dim: 'culture',
  theme: 'experimentation climate',
  title: 'Experimentation climate',
  help: 'Whether employees can try appropriate AI tools within clear, safe boundaries.',
  anchors: ['Experimentation is discouraged, prohibited, or associated with personal risk.', 'A few individuals experiment informally without organisational support.', 'Selected pilots or approved experiments exist, but access and support are inconsistent.', 'Employees across the selected scope can experiment with approved tools and clear boundaries.', 'Experimentation is embedded, supported, reviewed, and connected to organisational learning.'],
  strongNote: 'employees can experiment with approved tools inside clear boundaries',
  weakNote: 'safe, sanctioned space to experiment is largely absent or informal'
}, {
  id: 'C2',
  dim: 'culture',
  theme: 'learning and peer support',
  title: 'Learning and peer support',
  help: 'Whether practical learning, peer support, or local expertise is available for AI use.',
  anchors: ['No learning or support is available.', 'Employees depend mainly on individual self-learning.', 'Occasional training or informal peer support exists.', 'Role-relevant training, communities, champions, or coaching are consistently available.', 'Continuous learning is embedded, participation is monitored, and support adapts to emerging needs.'],
  strongNote: 'role-relevant learning, communities or local champions are consistently available',
  weakNote: 'employees rely largely on self-teaching without structured peer support'
}, {
  id: 'C3',
  dim: 'culture',
  theme: 'employee concerns',
  title: 'Fear, resistance, and employee concerns',
  help: 'How effectively concerns about job impact, reliability, identity, and changing practices are addressed.',
  anchors: ['Concerns are ignored, dismissed, or allowed to develop into active resistance.', 'Concerns are recognised but no structured response is provided.', 'Communication or support exists, but it is inconsistent or mainly reactive.', 'Concerns are discussed transparently and employees receive relevant involvement and support.', 'Employee sentiment and change impacts are actively monitored, and interventions adapt accordingly.'],
  strongNote: 'concerns about AI are discussed openly and employees are actively supported',
  weakNote: 'anxieties about job impact or identity are recognised but not actively addressed'
}, {
  id: 'C4',
  dim: 'culture',
  theme: 'breadth of participation',
  title: 'Breadth of employee participation',
  help: 'How widely meaningful AI use is distributed across employees and functions.',
  anchors: ['There is no meaningful AI use.', 'Use depends on one or a few highly motivated individuals.', 'Several employees or teams use AI, but participation is highly uneven.', 'AI use is distributed across relevant roles, with support for less-experienced groups.', 'Sustained, role-appropriate use is widespread, while adoption differences are actively addressed.'],
  strongNote: 'meaningful use is distributed across roles rather than concentrated in a few people',
  weakNote: 'meaningful use remains concentrated among a small number of advanced users'
}, {
  id: 'C5',
  dim: 'culture',
  theme: 'learning from experience',
  title: 'Learning from success, failure, and limitations',
  help: 'Whether AI experiences, failures, useful practices, and limitations become organisational learning.',
  anchors: ['Failures are hidden, punished, or not discussed.', 'Lessons are exchanged informally between individuals.', 'Some teams share experiences, but follow-up is inconsistent.', 'Successful and unsuccessful use cases are regularly reviewed and shared.', 'Formal feedback loops convert experience into updated guidance, training, workflows, and decisions.'],
  strongNote: 'successful and failed use cases are reviewed and turned into shared guidance',
  weakNote: 'lessons from AI use stay with individuals and are not converted into shared learning'
},
// ---------- EXPECTATION–CAPABILITY ----------
{
  id: 'E1',
  dim: 'expectations',
  theme: 'realism of expectations',
  title: 'Realism and specificity of expectations',
  help: 'Whether expectations are tied to defined business problems, use cases, and realistic limits.',
  anchors: ['Expectations are driven mainly by hype, fear, or vague promises.', 'Broad productivity or automation expectations exist without clear use cases.', 'Some use cases are defined, but expected benefits and limitations remain inconsistent.', 'Expected outcomes, boundaries, and intended users are clearly defined for priority use cases.', 'Expectations are continuously updated using operational evidence, user learning, and changing capabilities.'],
  strongNote: 'expectations are tied to defined use cases with explicit outcomes and limits',
  weakNote: 'expectations are shaped more by hype or vague promises than by defined use cases'
}, {
  id: 'E2',
  dim: 'expectations',
  theme: 'limitation awareness & validation',
  title: 'Limitation awareness and human validation',
  help: 'Whether users understand AI limitations and apply appropriate human review.',
  anchors: ['Outputs are assumed to be correct or autonomous without meaningful checking.', 'Some users recognise limitations, but verification is informal and inconsistent.', 'Guidance exists, but review practices differ substantially between users or teams.', 'Human validation and risk-appropriate quality checks are embedded in relevant use cases.', 'Verification, monitoring, escalation, and oversight are continuously reviewed and improved.'],
  strongNote: 'risk-appropriate human validation is embedded in relevant use cases',
  weakNote: 'human review of AI outputs is informal and inconsistent across users'
}, {
  id: 'E3',
  dim: 'expectations',
  theme: 'prompting & task framing',
  title: 'Prompting, context, and task-framing capability',
  help: 'Whether employees can provide the instructions, context, and framing that useful outputs require.',
  anchors: ['Employees generally lack the ability to use AI effectively.', 'Effective use is limited to a small number of self-taught users.', 'Basic prompting knowledge exists, but output quality is inconsistent.', 'Employees receive role-specific guidance, templates, and practical support for task framing and verification.', 'Reusable practices, advanced support, feedback, and performance monitoring continuously improve output quality.'],
  strongNote: 'employees receive role-specific support for prompting, context and verification',
  weakNote: 'effective prompting and task framing are confined to a few self-taught users'
}, {
  id: 'E4',
  dim: 'expectations',
  theme: 'capability development',
  title: 'Role-specific capability development',
  help: 'Whether the organisation systematically develops the AI capabilities different roles need.',
  anchors: ['No capability-development activities exist.', 'Generic or one-time awareness sessions are provided.', 'Some role-specific training exists but is not systematic.', 'Learning pathways, coaching, practice opportunities, and support are aligned with role requirements.', 'Capability needs are assessed regularly and learning programmes are continuously adapted and evaluated.'],
  strongNote: 'capability development is aligned to specific role requirements',
  weakNote: 'capability building is generic or one-off rather than tied to role needs'
}, {
  id: 'E5',
  dim: 'expectations',
  theme: 'expected vs realised value',
  title: 'Expected versus realised value',
  help: 'Whether expected benefits are compared with actual outcomes, cost, quality, and added work.',
  anchors: ['AI initiatives are pursued without defined outcomes or measurement.', 'Benefits are based mainly on anecdotes or general impressions.', 'Some indicators exist, but baselines, costs, quality, or added workload are not consistently considered.', 'Expected outcomes are compared with measurable operational results and costs.', 'Evidence on value, quality, risk, cost, and added workload is used to scale, redesign, pause, or stop initiatives.'],
  strongNote: 'expected benefits are compared with measured outcomes, cost and added work',
  weakNote: 'value is judged from impressions rather than measured against outcomes and cost'
},
// ---------- LEADERSHIP ENGAGEMENT ----------
{
  id: 'L1',
  dim: 'leadership',
  theme: 'strategic direction',
  title: 'Strategic direction',
  help: 'Whether leadership has set a clear, context-appropriate direction for AI adoption.',
  anchors: ['No meaningful direction or priority exists.', 'Leadership refers to AI broadly but provides no clear organisational direction.', 'Priorities exist in selected areas but remain inconsistent or weakly connected.', 'The organisation has clear AI priorities, intended outcomes, and boundaries for the selected scope.', 'AI direction is integrated with organisational strategy and updated using evidence and learning.'],
  strongNote: 'clear AI priorities, outcomes and boundaries are defined for this scope',
  weakNote: 'AI is referred to broadly but without a clear organisational direction'
}, {
  id: 'L2',
  dim: 'leadership',

const numeric=v=>Number.isInteger(v)&&v>=0&&v<=4;
function dimensionScore(dim,answers){const vals=QIDS[dim].map(id=>answers[id]).filter(numeric);return vals.length<CONFIG.minAnsweredPerDimension?null:Math.round((vals.reduce((a,b)=>a+b,0)/vals.length*25)*10)/10;}
function allDimensionScores(answers){return Object.fromEntries(DIM_ORDER.map(d=>[d,dimensionScore(d,answers)]));}
function completeness(dim,answers){const count=QIDS[dim].filter(id=>numeric(answers[id])).length;return {count,label:count===5?'High':count===4?'Moderate':count===3?'Low':'No dimension score'};}
function rangeLabel(score,dim,answers){if(score==null)return'Insufficient evidence';if(score<25)return'Critical or absent';if(score<45)return'Fragmented';if(score<65)return'Emerging';if(score<80)return'Established';const low=QIDS[dim].some(id=>numeric(answers[id])&&answers[id]<3);return low?'Established':'Integrated and adaptive';}

function pairCalculation(pair,scores,answers){const A=subsetScore(pair.aIds,pair.a,scores,answers),B=subsetScore(pair.bIds,pair.b,scores,answers);if(A.score==null||B.score==null)return{...pair,aScore:A.score,bScore:B.score,aFallback:A.fallback,bFallback:B.fallback,classification:'No clear interaction',insufficient:true};const allIds=[...pair.aIds,...pair.bIds];const anyBelow3=allIds.some(id=>numeric(answers[id])&&answers[id]<3);const diff=Math.abs(A.score-B.score);let classification;if(A.score>=65&&B.score>=65&&!anyBelow3)classification='Mutually reinforcing';else if(A.score<50&&B.score<50)classification='Mutually constraining';else if(diff>=CONFIG.directionalDifference&&((A.score>=65&&B.score<50)||(B.score>=65&&A.score<50)))classification='One area ahead of the other';else if(A.score>=65&&B.score>=65&&anyBelow3)classification='Partially reinforcing / uneven';else if(A.score<65&&B.score<65&&diff<CONFIG.directionalDifference)classification='Balanced but developing';else classification='Partially reinforcing / uneven';return{...pair,aScore:A.score,bScore:B.score,aFallback:A.fallback,bFallback:B.fallback,classification,insufficient:false,diff};}
function allInteractions(scores,answers){return PAIRS.map(p=>pairCalculation(p,scores,answers));}
function valueRealisation(answers){const keys=['E1','E5','L4','S4','S1'],essential=['E5','L4','S1','S4'];const present=keys.filter(k=>numeric(answers[k]));const missingEssential=essential.filter(k=>!numeric(answers[k]));if(present.length<3||missingEssential.length>=2)return{label:'Insufficient evidence to assess measurable value',score:null,missingEssential,gates:[]};const score=Math.round(present.reduce((s,k)=>s+answers[k],0)/present.length*25*10)/10;let rank=score<35?0:score<60?1:score<80?2:3;const labels=['Weakly evidenced','Developing','Operationally supported','Strongly embedded'];const gates=[];const cap=(n,reason)=>{if(rank>n){rank=n;gates.push(reason)}};if(numeric(answers.E5)&&answers.E5<3)cap(2,'Value measurement is below 3, so the reading cannot be strongly embedded.');if(numeric(answers.L4)&&answers.L4<3)cap(1,'Business ownership is below 3, so the reading remains at a developing level.');if((numeric(answers.S1)&&answers.S1<2)||(numeric(answers.S4)&&answers.S4<2))cap(1,'Data or workflow foundations are below 2, so the reading remains at a developing level.');const below3=present.filter(k=>answers[k]<3).length;if(below3>=3)cap(1,'Several essential value conditions remain below 3, so the reading remains at a developing level.');let incomplete=false;if(missingEssential.length===1){incomplete=true;cap(1,'One essential value component is unanswered, so the reading cannot exceed developing.');}return{label:labels[rank]+(incomplete&&rank<=1?' — incomplete evidence':''),score,missingEssential,gates,components:Object.fromEntries(keys.map(k=>[k,answers[k]]))};}
function evidenceBasis(ctx){const mode=ctx.mode||'',contributors=ctx.contributors||'',docs=ctx.docsReviewed==='Yes';let pts=0;if(mode==='Evidence-based organisational review'||mode==='Facilitated workshop')pts+=2;else if(mode==='Team discussion')pts+=1;if(contributors==='4 or more')pts+=2;else if(contributors==='2–3')pts+=1;if(docs)pts+=1;let label=pts>=4?'Broad':pts>=2?'Moderate':'Limited';if(label==='Broad'&&!docs)label='Moderate';return{label,points:pts,basis:[mode||'assessment mode not specified',contributors?(contributors==='1'?'one contributor':contributors+' contributors'):'contributors not specified',docs?'documents or operational data reviewed':'no documents or operational data recorded'].join(', ')};}
function actionSequence(scores,answers,ctx){const pa=priorityAnalysis(scores,answers),g=questionGaps(answers);if(!pa.group.length)return{confirm:[],act:[],next:[],reassess:[]};const groupIds=pa.group.flatMap(d=>QIDS[d]).filter(id=>numeric(answers[id]));const min=groupIds.length?Math.min(...groupIds.map(id=>answers[id])):null;let act=groupIds.filter(id=>answers[id]===min);let next=groupIds.filter(id=>!act.includes(id)&&answers[id]<=2);pa.group.forEach(d=>{if(!act.concat(next).some(id=>Q[id].dim===d)){const vals=QIDS[d].filter(id=>numeric(answers[id]));if(vals.length){const m=Math.min(...vals.map(id=>answers[id]));vals.filter(id=>answers[id]===m).forEach(id=>{if(!act.includes(id)&&!next.includes(id))next.push(id)})}}});pa.related.forEach(d=>QIDS[d].filter(id=>numeric(answers[id])&&answers[id]<=1).forEach(id=>{if(!act.includes(id)&&!next.includes(id))next.push(id)}));act=[...new Set(act)];next=[...new Set(next)];const confirm=[...new Set([...act,...next].filter(id=>answers[id]<=1))];return{confirm,act,next,reassess:[...new Set([...act,...next])],title2:pa.noSevere?'Strengthen further':'Act now',priority:pa};}
function computeAssessment(ctx,answers,notes={}){const scores=allDimensionScores(answers),priority=priorityAnalysis(scores,answers),gaps=questionGaps(answers),interactions=allInteractions(scores,answers),value=valueRealisation(answers),evidence=evidenceBasis(ctx),sequence=actionSequence(scores,answers,ctx);return{ctx,answers,notes,scores,priority,gaps,interactions,value,evidence,sequence};}

const lc=s=>s?String(s).charAt(0).toLowerCase()+String(s).slice(1):'';
const cap=s=>s?String(s).charAt(0).toUpperCase()+String(s).slice(1):'';
const andList=a=>a.length<2?(a[0]||''):a.length===2?a.join(' and '):a.slice(0,-1).join(', ')+', and '+a.at(-1);
function evidencePrefix(e){return e.label==='Limited'?'This assessment suggests':'The recorded assessment indicates';}
function findingFor(id,rating,evidence){const q=Q[id],anchor=q.anchors[rating];const lead=evidence.label==='Limited'?`This assessment suggests that ${lc(q.title)} is ${FINDING_LEVELS[rating]}.`:`The recorded assessment indicates that ${lc(q.title)} is ${FINDING_LEVELS[rating]}.`;return `${lead} ${anchor}`;}
function contextAction(id,base,ctx){let text=base;const size=ctx.size||'',stage=ctx.stage||'',sens=ctx.sensitivity||'';const small=/^(1–9|10–49)/.test(size),large=/^(250|1,000|10,000)/.test(size),early=/Not yet|Exploring|Prototype|feasibility/i.test(stage),scaling=/Operational|Scaling|Continuous/i.test(stage),regulated=/High|Very high/.test(sens);
 if(small&&['L4','L5','S5','S2'].includes(id))text+=' Keep the arrangement lightweight: one person may hold several responsibilities, but each responsibility and decision right should still be explicit.';
 if(large&&['L4','L5','S5','S3','S4'].includes(id))text+=' Where several functions are involved, make the decision rights, handovers, and escalation path explicit between the units that actually participate.';
 if(regulated&&['S2','E2','S1','S4'].includes(id))text+=' Apply the change through a risk-based approach that preserves required privacy, security, traceability, human oversight, and escalation.';

function recommendationFor(id,rating,ctx,evidence){const r=REC[id];const finding=findingFor(id,rating,evidence);const action=contextAction(id,r.actions[rating],ctx);return{id,rating,title:`${Q[id].title} (${id})`,finding,why:r.why,action,owners:r.owners,evidence:r.evidence};}
function weakest(ids,answers){const vals=ids.filter(id=>numeric(answers[id]));if(!vals.length)return[];const m=Math.min(...vals.map(id=>answers[id]));return vals.filter(id=>answers[id]===m);}
function interactionText(calc,answers,scores,ctx,evidence){if(calc.insufficient)return{show:`There is not enough evidence to interpret ${DIM[calc.a].label} and ${DIM[calc.b].label} as a relationship. The two areas should be considered separately until more linked questions are answered.`,where:'At least one side could not be calculated from two linked answers or a valid wider area score.',why:`This relationship examines ${lc(calc.issue)}`,next:'Answer or confirm the missing linked questions before drawing a relationship-level conclusion.',basedOn:[]};
 const aWeak=weakest(calc.aIds,answers),bWeak=weakest(calc.bIds,answers),dir=calc.aScore-calc.bScore;let show,where,next,based=[];
 if(calc.classification==='Mutually reinforcing')show=`The answers suggest that ${DIM[calc.a].label} and ${DIM[calc.b].label} are both established within the questions used for this relationship, with no linked answer below 3.`;

 if(Math.abs(dir)>=CONFIG.directionalDifference){const weakSide=dir>0?calc.b:calc.a,ids=weakSide===calc.a?aWeak:bWeak;based=ids;where=`The difference is mainly visible in ${andList(ids.map(id=>`${Q[id].title} (${id}), rated ${answers[id]}`))}.`;}else{based=[...aWeak,...bWeak];where=`The lowest linked conditions are ${andList(based.map(id=>`${Q[id].title} (${id}), rated ${answers[id]}`))}. The linked-question results are close enough that the framework does not present one area as clearly ahead of the other.`;}

 scoring:`Each of the four dimensions has five questions. Every answered question has the same weight. Ratings run from 0 to 4. “Not sure” and unanswered questions are left out of the calculation. A dimension score is calculated only when at least ${CONFIG.minAnsweredPerDimension} of the five questions are rated. The average rating is multiplied by 25 to give a score from 0 to 100.`,

function contextScreen(){return `<div class="card"><div class="eyebrow">1 · Define the context</div><h2>What exactly are you assessing?</h2><p class="muted">The same organisation can have very different conditions across departments, teams, products, and use cases. The scope remains visible in the results so a narrow assessment is not presented as a statement about the whole organisation.</p><div class="grid2">${CONTEXT.map(c=>`<div><label class="fld">${c.label}</label><select data-ctx="${c.id}"><option value="">Select…</option>${c.options.map(o=>`<option ${state.ctx[c.id]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`).join('')}</div><div class="between" style="margin-top:16px"><button class="btn" data-go="0">Back</button><button class="btn primary" data-go="2">Continue to Culture & people</button></div></div>`}
function dimScreen(dimIndex){const d=DIMENSIONS[dimIndex],qs=QUESTIONS.filter(q=>q.dim===d.id);return `<div class="card" style="--dim:${d.color}"><div class="eyebrow">${dimIndex+2} · ${d.label}</div><h2>${d.label}</h2><p class="muted">${esc(d.desc)}</p><h3>Five conditions covered in this area</h3><div class="condition-strip">${qs.map(q=>`<div class="condition-chip" style="--dim:${d.color}"><b>${q.id}</b>${esc(q.title)}</div>`).join('')}</div></div>${qs.map(q=>questionCard(q,d)).join('')}<div class="card between"><button class="btn" data-go="${dimIndex+1}">Back</button><button class="btn primary" data-go="${dimIndex===3?6:dimIndex+3}">${dimIndex===3?'Review answers':'Continue'}</button></div>`}
function questionCard(q,d){const v=state.answers[q.id];const note=state.notes[q.id]||{};return `<div class="card question" style="--dim:${d.color}"><div class="between"><div><div class="qmeta">${q.id}</div><div class="qtitle">${esc(q.title)}</div></div>${numeric(v)?`<span class="badge"><span class="dot" style="--tone:${toneFor(v*25)}"></span>Rating ${v}</span>`:''}</div><p class="qprompt">${esc(q.question)}</p><p class="qhelp">${esc(q.intended)}</p><div class="options" role="radiogroup" aria-label="${esc(q.title)}">${q.anchors.map((a,i)=>`<button class="opt ${v===i?'sel':''}" data-answer="${q.id}" data-value="${i}" style="--dim:${d.color}" role="radio" aria-checked="${v===i?'true':'false'}"><span class="mark" aria-hidden="true"></span><span class="lvl" aria-hidden="true">${i}</span><span class="opt-main"><span class="opt-label">${esc(LEVEL_LABELS[i])}</span><span class="opt-desc">${esc(a)}</span></span></button>`).join('')}<button class="opt ns ${v==='ns'?'sel':''}" data-answer="${q.id}" data-value="ns" style="--dim:${d.color}" role="radio" aria-checked="${v==='ns'?'true':'false'}"><span class="mark" aria-hidden="true"></span><span class="lvl" aria-hidden="true">?</span><span class="opt-main"><span class="opt-label">Not sure / insufficient evidence</span><span class="opt-desc">Excluded from the score and listed under “information still needed”.</span></span></button></div><details class="ev"><summary>What counts as evidence?</summary><div class="ev-body"><p class="small" style="margin:0;color:var(--ink)">For example: ${esc(q.evidenceHint)}</p></div></details><details class="ev"><summary>Record the basis of this answer <span class="muted tiny">optional; does not change the score</span></summary><div class="ev-body"><div class="evidence-grid"><div><label class="fld">Evidence type</label><select data-note="${q.id}" data-field="type"><option value=""></option>${['Observation','Performance measure','Document reference','Process example','Stakeholder source'].map(o=>`<option ${note.type===o?'selected':''}>${o}</option>`).join('')}</select></div><div><label class="fld">Relevant period</label><input type="text" value="${esc(note.period||'')}" data-note="${q.id}" data-field="period" placeholder="e.g. Q2 2026"></div><div><label class="fld">Scope of evidence</label><select data-note="${q.id}" data-field="scope"><option value=""></option>${['Same as assessment','Narrower team or use case','Wider than assessment','Not sure'].map(o=>`<option ${note.scope===o?'selected':''}>${o}</option>`).join('')}</select></div><div><label class="fld">Observation / reference</label><textarea data-note="${q.id}" data-field="text" placeholder="Do not enter confidential information.">${esc(note.text||'')}</textarea></div></div>${alignmentFlag(q.id,state.answers,state.notes)?`<div class="callout warn small" style="margin-top:8px">${alignmentFlag(q.id,state.answers,state.notes)}</div>`:''}</div></details></div>`}
function reviewScreen(){const result=computeAssessment(state.ctx,state.answers,state.notes);return `<div class="card"><div class="eyebrow">6 · Review</div><h2>Review before generating results</h2><p class="muted">“Not sure” and unanswered items stay outside the calculation. A dimension needs at least three rated questions.</p><div class="grid4">${DIMENSIONS.map(d=>{const c=completeness(d.id,state.answers),s=result.scores[d.id];return`<div class="card" style="box-shadow:none;border-top:4px solid ${d.hex}"><h3>${d.label}</h3><div class="score">${s==null?'—':s}</div><p class="small">${c.count}/5 answered · ${c.label}</p></div>`}).join('')}</div><div class="callout ${result.evidence.label==='Limited'?'warn':''}" style="margin-top:12px"><strong>Evidence basis: ${result.evidence.label}.</strong> ${esc(result.evidence.basis)}. This is separate from response completeness.</div><div class="between" style="margin-top:16px"><button class="btn" data-go="5">Back</button><button class="btn primary" data-go="7">Generate results</button></div></div>`}
function resultTabs(){const tabs=[['overview','Overview'],['profile','Question profile'],['interactions','Interactions'],['actions','Action plan'],['method','Methodology & tests']];return`<div class="tabs no-print">${tabs.map(([id,l])=>`<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">${l}</button>`).join('')}</div>`}
function ratingClass(v){return numeric(v)?`r${v}`:'rns';}
function dimBullets(list,cls){return list.length?`<ul class="dim-list">${list.map(item=>`<li><span class="${cls}-mark">${cls==='strength'?'▲':cls==='dev'?'◆':'▼'}</span> ${esc(item.t)} <span class="dim-rate" data-rate="${item.v}">${item.v}</span></li>`).join('')}</ul>`:'<p class="small muted">None in this category.</p>';}
function dimNarrative(d,result){const entries=QIDS[d.id].map(id=>({id,q:Q[id],v:result.answers[id]})).filter(x=>numeric(x.v));const strengths=entries.filter(x=>x.v>=3).map(x=>x.q.title.toLowerCase());const dev=entries.filter(x=>x.v===2).map(x=>x.q.title.toLowerCase());const crit=entries.filter(x=>x.v<=1).map(x=>x.q.title.toLowerCase());let txt=''; if(strengths.length) txt+=`Established practice is visible in ${andList(strengths.slice(0,2))}. `; if(crit.length) txt+=`${crit.length===1?'The clearest weakness is':'The clearest weaknesses are'} ${andList(crit.slice(0,2))}. `; else if(dev.length) txt+=`The main development ${dev.length===1?'area is':'areas are'} ${andList(dev.slice(0,2))}. `; if(!txt) txt='The available answers in this area are still too limited for a clear reading.'; return txt.trim();}
function scoreCards(result){return `<div class="result-overview-grid">${DIMENSIONS.map(d=>{const s=result.scores[d.id],c=completeness(d.id,result.answers),entries=QIDS[d.id].map(id=>({id,q:Q[id],v:result.answers[id]})),strengths=entries.filter(x=>numeric(x.v)&&x.v>=3).map(x=>({t:`${x.q.title} (${x.id})`,v:x.v})),dev=entries.filter(x=>x.v===2).map(x=>({t:`${x.q.title} (${x.id})`,v:x.v})),crit=entries.filter(x=>numeric(x.v)&&x.v<=1).map(x=>({t:`${x.q.title} (${x.id})`,v:x.v}));return `<div class="card scorecard" style="--dim:${d.hex};--hex:${d.hex}"><div class="score-top"><div class="dim-pill"><span class="dot"></span>${d.label}</div><span class="badge"><span class="dot" style="--tone:${toneFor(s)}"></span>${esc(rangeLabel(s,d.id,result.answers))}</span></div><div class="score-hero"><div class="score-ring" style="--p:${s==null?0:s};--dim:${toneFor(s)}"><div class="ring-text"><div><div class="ring-score">${s==null?'—':s}</div><span class="ring-outof">/ 100</span></div></div></div><div class="score-meta"><div class="summary-chip">Response completeness: ${c.label} · ${c.count}/5 answered</div><div class="seg-row">${entries.map(x=>`<span class="seg ${ratingClass(x.v)}" title="${esc(x.id+' · '+x.q.title+' · rating '+(numeric(x.v)?x.v:'Not sure'))}"></span>`).join('')}</div><div class="legend-note">Five bars show the five conditions in this area from left to right.</div></div></div><div class="dim-section-title strength">Current strengths</div>${dimBullets(strengths.slice(0,3),'strength')}<div class="dim-section-title dev">Development areas (rated 2)</div>${dimBullets(dev.slice(0,3),'dev')}<div class="dim-section-title crit">Critical issues (rated 0–1)</div>${dimBullets(crit.slice(0,3),'crit')}<div class="info-box"><strong>What this means.</strong> ${esc(dimNarrative(d,result))}</div><details class="ev"><summary>Selected answers & notes</summary><div class="ev-body"><div class="stack">${entries.map(x=>`<div class="small"><strong>${x.id} · ${esc(x.q.title)}</strong> — ${numeric(x.v)?'Rating '+x.v+': '+esc(x.q.anchors[x.v]):'Not sure / insufficient evidence'}${state.notes[x.id]&&state.notes[x.id].text?`<br><span class="muted">Note: ${esc(state.notes[x.id].text)}</span>`:''}</div>`).join('')}</div></div></details></div>`}).join('')}</div>`}
function qprofile(d,result){return `<div class="card profile-card" style="--dim:${d.hex}"><div class="profile-head"><div><div class="profile-badge" style="--dim:${d.hex}"><span class="dot"></span>${d.label}</div><div class="profile-sub">Dimension colour identifies the area; each bar colour shows the condition status.</div></div></div>${QIDS[d.id].map(id=>{const q=Q[id],v=result.answers[id],pct=numeric(v)?v*25:0;return`<div class="qprofile"><div class="qp-title">${esc(q.title)} <span class="qcode">(${id})</span></div><div class="rating-badge" data-rate="${numeric(v)?v:'ns'}">${numeric(v)?String(v):'—'}</div><div class="bar mini" style="--dim:${numeric(v)?toneFor(pct):'var(--muted)'};--w:${pct}%"><i></i></div></div>`}).join('')}</div>`}
function valueCard(result){const v=result.value;const items=['E1','E5','L4','S4','S1'];return `<div class="card value-card"><div class="value-head"><div><div class="value-kicker">Cross-cutting reading</div><h3 class="value-title">Measurable value</h3><div class="value-sub">This is not a fifth dimension. It is a combined reading of whether AI use is tied to defined use cases, owned by the business, measured in practice, and supported by reliable data and workflows.</div></div><span class="badge"><span class="dot" style="--tone:${toneFor(v.score)}"></span>${esc(v.label)}</span></div><div class="between" style="margin-top:6px"><div><span class="score">${v.score==null?'—':v.score}</span><span class="muted"> / 100 indicative</span></div><span class="summary-chip">Uses 5 linked conditions</span></div><div class="value-chip-grid">${items.map(id=>`<div class="value-chip" style="--dim:${DIM[Q[id].dim].hex}"><b>${id}</b><span>${esc(Q[id].title)}</span></div>`).join('')}</div><div class="value-note"><strong>How to read it.</strong> Treat this as a short management reading about whether value is likely to be evidenced and owned in practice. It summarises five linked conditions across the framework and should be read together with the four dimension scores, not instead of them.</div>${v.gates&&v.gates.length?`<div class="callout warn small" style="margin-top:10px">${v.gates.map(esc).join(' ')}</div>`:''}</div>`}
function overviewTab(result){const p=result.priority;return `<div class="card"><div class="eyebrow">Main finding</div><h2>${p.noSevere?'Relative development priorities':'Where to look first'}</h2><p>${esc(mainFinding(result))}</p><div class="callout ${result.evidence.label==='Limited'?'warn':''}"><strong>Evidence basis: ${result.evidence.label}.</strong> ${esc(result.evidence.basis)}.${result.evidence.label==='Limited'?' Confirm important findings with other relevant roles or evidence before treating them as organisational facts.':''}</div><div class="colour-grammar"><strong>Colour key:</strong> blue, violet, cyan and slate identify the four dimensions. Green, amber and red indicate result status. Relationship lines use the result-status system; dimension nodes keep their identity colours.</div></div>${scoreCards(result)}<div class="grid2" style="margin-top:14px"><div class="card"><h3>Overall readiness pattern</h3><p>${esc(overallPattern(result))}</p><h4>Assessment context</h4><div class="kv">${Object.entries(result.ctx).filter(([,v])=>v).map(([k,v])=>`<dt>${esc((CONTEXT.find(x=>x.id===k)||{label:k}).label)}</dt><dd>${esc(v)}</dd>`).join('')}</div></div>${valueCard(result)}</div>`}
function profileTab(result){return `<div class="card"><h2>Why each area received its score</h2><p class="muted">The area score is shown together with all five question-level conditions so an average cannot hide a critical weakness.</p></div><div class="grid2">${DIMENSIONS.map(d=>qprofile(d,result)).join('')}</div><div class="card"><h3>Question-level reading</h3><div class="grid2"><div><h4>Critical gaps · rating 0–1</h4><ul>${result.gaps.critical.length?result.gaps.critical.map(q=>`<li>${esc(q.title)} (${q.id}) · ${result.answers[q.id]}</li>`).join(''):'<li>None</li>'}</ul></div><div><h4>Development areas · rating 2</h4><ul>${result.gaps.developing.length?result.gaps.developing.map(q=>`<li>${esc(q.title)} (${q.id})</li>`).join(''):'<li>None</li>'}</ul></div></div></div>`}
function interactionEdgeStyle(classification){if(classification==='Mutually reinforcing')return{color:'var(--good)',bg:'#edf5ef',label:'Mutually reinforcing',dash:false};if(classification==='Mutually constraining')return{color:'var(--bad)',bg:'#fbebea',label:'Mutually constraining',dash:false};if(classification==='One area ahead of the other')return{color:'var(--info)',bg:'#eef4f7',label:'One area ahead',dash:false};if(classification==='Balanced but developing')return{color:'var(--warn)',bg:'#fbf3e6',label:'Balanced but developing',dash:false};if(classification==='Partially reinforcing / uneven')return{color:'#c17a1a',bg:'#fff6e7',label:'Partially reinforcing / uneven',dash:false};return{color:'#7b8790',bg:'#f3f5f6',label:'No clear interaction',dash:true};}
function interactionPatternPills(result){const counts={};result.interactions.forEach(c=>{counts[c.classification]=(counts[c.classification]||0)+1});return Object.entries(counts).map(([label,count])=>{const s=interactionEdgeStyle(label);return `<span class="pattern-pill" style="--edge:${s.color};--edgebg:${s.bg}"><i></i>${count} ${esc(label.toLowerCase())}</span>`}).join('')}
function interactionMap(result){const paths={'culture|expectations':{d:'M280 82 L425 225',n:'edge-n1'},'culture|leadership':{d:'M280 82 L135 225',n:'edge-n2'},'culture|structure':{d:'M280 82 Q350 225 280 368',n:'edge-n3'},'expectations|leadership':{d:'M425 225 Q280 288 135 225',n:'edge-n4'},'expectations|structure':{d:'M425 225 L280 368',n:'edge-n5'},'leadership|structure':{d:'M135 225 L280 368',n:'edge-n6'}};const nodes=[{id:'culture',cls:'node-top'},{id:'expectations',cls:'node-right'},{id:'structure',cls:'node-bottom'},{id:'leadership',cls:'node-left'}];const indexed=result.interactions.map((c,i)=>({...c,pairNo:i+1,style:interactionEdgeStyle(c.classification),path:paths[c.key]}));const selected=indexed.find(c=>c.key===state.pair)||indexed[0];const lines=indexed.map(c=>`<path class="kite-line ${c.style.dash?'unclear':''}" d="${c.path.d}" stroke="${c.style.color}" />`).join('');const numbers=indexed.map(c=>`<span class="edge-number ${c.path.n}" style="--edge:${c.style.color}" title="Pair ${c.pairNo}">${c.pairNo}</span>`).join('');const rows=indexed.map(c=>`<button class="relationship-row ${selected.key===c.key?'active':''}" data-pair="${c.key}" style="--edge:${c.style.color};--edgebg:${c.style.bg}" aria-label="Pair ${c.pairNo}: ${DIM[c.a].label} and ${DIM[c.b].label}"><span class="relationship-num">${c.pairNo}</span><span><span class="relationship-pair">Pair ${c.pairNo} · ${DIM[c.a].label} ↔ ${DIM[c.b].label}</span><span class="relationship-status">${esc(c.style.label)}</span></span><span class="relationship-open">View details →</span></button>`).join('');return `<div class="kite-wrap"><p class="kite-caption">Node colours identify the four dimensions. Line colours show the relationship classification. If several lines have the same colour, those relationships received the same classification from the answers.</p><div class="kite-layout"><div class="kite-figure-col"><div class="kite-canvas"><svg class="kite-svg" viewBox="0 0 560 430" aria-hidden="true"><path class="kite-outline" d="M280 82 L425 225 L280 368 L135 225 Z" />${lines}</svg>${nodes.map(n=>`<div class="kite-node ${n.cls}" style="--node:${DIM[n.id].hex}"><div><strong>${DIM[n.id].label}</strong></div></div>`).join('')}${numbers}</div><div class="selected-pair-card" style="--edge:${selected.style.color};--edgebg:${selected.style.bg}"><div class="selected-pair-label">Currently selected</div><div class="selected-pair-title">Pair ${selected.pairNo} · ${DIM[selected.a].label} ↔ ${DIM[selected.b].label}</div><div class="selected-pair-status"><i></i>${esc(selected.style.label)}</div><div class="selected-pair-help">Its full interpretation is shown directly below this relationship section.</div></div></div><div class="kite-key"><h3>Six dimension pairs</h3><div class="kite-key-intro">Choose one pair to examine in more detail.</div><div class="pair-action-note"><strong>How to use this list:</strong> click any pair or “View details →”. The selected pair will be highlighted here, and its detailed interpretation will open directly below this section.</div><div class="pair-number-note"><strong>What do 1–6 mean?</strong> They simply label the six dimension pairs so each line can be matched to the list. They do not indicate strength, quality, or importance. Line colour shows the relationship type.</div><div class="relationship-list">${rows}</div><div class="kite-legend"><span class="legend-pill" style="--sw:var(--good)"><span class="legend-swatch"></span>Reinforcing</span><span class="legend-pill" style="--sw:#c17a1a"><span class="legend-swatch"></span>Uneven</span><span class="legend-pill" style="--sw:var(--warn)"><span class="legend-swatch"></span>Developing</span><span class="legend-pill" style="--sw:var(--info)"><span class="legend-swatch"></span>Ahead</span><span class="legend-pill" style="--sw:var(--bad)"><span class="legend-swatch"></span>Constraining</span><span class="legend-pill" style="--sw:#7b8790"><span class="legend-swatch"></span>Unclear</span></div></div></div><div class="kite-legend-explained" style="margin-top:14px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 15px;box-shadow:0 4px 14px rgba(31,42,51,.04)"><div style="font-size:.71rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#45525d;margin-bottom:9px">What each line colour means</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:8px 20px"><div style="display:grid;grid-template-columns:11px 1fr;gap:9px;align-items:start;font-size:.77rem;line-height:1.38;color:#45525d"><span class="legend-swatch" style="--sw:var(--good);margin-top:5px"></span><span><strong style="color:var(--ink)">Mutually reinforcing (green).</strong> Both areas are established and support each other — no linked condition is below 3.</span></div><div style="display:grid;grid-template-columns:11px 1fr;gap:9px;align-items:start;font-size:.77rem;line-height:1.38;color:#45525d"><span class="legend-swatch" style="--sw:#c17a1a;margin-top:5px"></span><span><strong style="color:var(--ink)">Partially reinforcing / uneven (orange).</strong> The two areas mostly work together, but support is patchy — one or more linked conditions lag behind.</span></div><div style="display:grid;grid-template-columns:11px 1fr;gap:9px;align-items:start;font-size:.77rem;line-height:1.38;color:#45525d"><span class="legend-swatch" style="--sw:var(--warn);margin-top:5px"></span><span><strong style="color:var(--ink)">Balanced but developing (amber).</strong> Both sides sit at a similar, still-developing level — neither strong nor critically weak.</span></div><div style="display:grid;grid-template-columns:11px 1fr;gap:9px;align-items:start;font-size:.77rem;line-height:1.38;color:#45525d"><span class="legend-swatch" style="--sw:var(--info);margin-top:5px"></span><span><strong style="color:var(--ink)">One area ahead of the other (blue-grey).</strong> Both clear the threshold, but one is clearly further along than the other.</span></div><div style="display:grid;grid-template-columns:11px 1fr;gap:9px;align-items:start;font-size:.77rem;line-height:1.38;color:#45525d"><span class="legend-swatch" style="--sw:var(--bad);margin-top:5px"></span><span><strong style="color:var(--ink)">Mutually constraining (red).</strong> Both areas are weak on their linked conditions and hold each other back.</span></div><div style="display:grid;grid-template-columns:11px 1fr;gap:9px;align-items:start;font-size:.77rem;line-height:1.38;color:#45525d"><span class="legend-swatch" style="--sw:#7b8790;margin-top:5px"></span><span><strong style="color:var(--ink)">No clear interaction (grey, dashed line).</strong> Not enough linked evidence to read a clear pattern between the two areas.</span></div></div></div></div>`}
function interactionsTab(result){const selected=result.interactions.find(x=>x.key===state.pair)||result.interactions[0];return `<div class="card"><h2>Six pairwise relationships</h2><p class="muted">These are structured interpretations of the selected answers. They do not claim that one area causes another.</p>${interactionMap(result)}</div><div id="interaction-detail">${interactionDetail(selected,result)}</div>`}
function interactionDetail(calc,result){const t=interactionText(calc,result.answers,result.scores,result.ctx,result.evidence),pairNo=result.interactions.findIndex(x=>x.key===calc.key)+1;return `<div class="card interaction-detail"><div class="eyebrow">Pair ${pairNo} · Detailed interpretation</div><div class="between"><h2>${DIM[calc.a].label} ↔ ${DIM[calc.b].label}</h2><span class="badge">${esc(calc.classification)}</span></div><div class="grid2"><div><h4>What the assessment shows</h4><p>${esc(t.show)}</p></div><div><h4>Where the difference comes from</h4><p>${esc(t.where)}</p></div><div><h4>Why this may matter</h4><p>${esc(t.why)}</p></div><div><h4>Suggested next step</h4><p>${esc(t.next)}</p></div></div><p class="tiny muted"><strong>Based on:</strong> ${t.basedOn.length?t.basedOn.map(id=>`${esc(Q[id].title)} (${id})`).join('; '):'insufficient linked evidence'}${calc.aFallback||calc.bFallback?' · Wider area score used as fallback on '+[calc.aFallback?DIM[calc.a].label:null,calc.bFallback?DIM[calc.b].label:null].filter(Boolean).join(' and '):''}</p></div>`}
function methodTab(result){return `<div class="card method-hero"><div class="eyebrow">Methodology</div><h2>Methodology used</h2><p class="method-lead">This section explains, in plain language, how the answers are turned into scores, priorities, relationship readings, and recommendations. The purpose is to make every result traceable and easy to understand.</p><div class="method-flow"><div class="method-flow-step"><b>Step 1</b><strong>Answer 20 questions</strong></div><div class="method-flow-arrow">→</div><div class="method-flow-step"><b>Step 2</b><strong>Calculate four dimension scores</strong></div><div class="method-flow-arrow">→</div><div class="method-flow-step"><b>Step 3</b><strong>Identify priority conditions</strong></div><div class="method-flow-arrow">→</div><div class="method-flow-step"><b>Step 4</b><strong>Examine six relationships</strong></div><div class="method-flow-arrow">→</div><div class="method-flow-step"><b>Step 5</b><strong>Build and reassess actions</strong></div></div></div>${methodologyHTML()}<div class="method-research"><h3>How the four dimensions relate to the research</h3><p class="small muted">The framework uses plain-language names for users. The research labels are shown here only for traceability.</p><div class="method-dims">${DIMENSIONS.map(d=>`<div class="method-dim"><strong>${d.label}</strong><span>Research label: ${d.academic}</span></div>`).join('')}</div></div><div class="method-use"><strong>How to use the results.</strong> Treat the framework as structured decision support. Use the scores to locate patterns and questions that deserve attention, then confirm important findings with relevant people and evidence before making significant organisational decisions.</div><details class="method-tech"><summary>Technical checks</summary><div class="method-tech-body"><div class="between"><div><h3>Regression tests</h3><p class="muted small">These checks are for maintaining the framework software. They do not affect assessment results.</p></div><button class="btn" data-runtests="1">Run tests</button></div><div id="test-output"></div></div></details>`}
function recCard(id,result){const rating=result.answers[id],r=recommendationFor(id,rating,result.ctx,result.evidence),d=DIM[Q[id].dim];return `<div class="rec-card"><div class="rec-head"><div><div class="rec-meta"><span class="dim-chip" style="--dim:${d.hex}"><span class="dot"></span>${d.label}</span><span class="q-chip">${id}</span></div><h3>${esc(r.title)}</h3></div><span class="badge"><span class="dot" style="--tone:${toneFor(rating*25)}"></span>Rating ${rating}</span></div><div class="answer-basis"><strong>Based on answer ${rating}:</strong> ${esc(Q[id].anchors[rating])}</div><div class="rec-sections"><div class="rec-row"><div class="rec-label">Finding</div><div class="rec-text">${esc(r.finding)}</div></div><div class="rec-row"><div class="rec-label">Why it matters</div><div class="rec-text">${esc(r.why)}</div></div><div class="rec-row"><div class="rec-label">Suggested next step</div><div class="rec-text">${esc(r.action)}</div></div><div class="rec-row"><div class="rec-label">Who should be involved</div><div class="rec-text">${esc(r.owners)}</div></div><div class="rec-row"><div class="rec-label">Evidence of progress</div><div class="rec-text">${esc(r.evidence)}</div></div></div></div>`}
function actionsTab(result){const s=result.sequence;if(!s.act.length)return`<div class="card"><h2>Action plan</h2><p>Not enough valid answers are available to build the sequence.</p></div>`;const confirmRoles=result.evidence.label==='Limited'?'Include at least one additional role that can see the business and operational side of the assessed scope, and review any relevant documents or operational measures.':'Confirm the lowest-rated conditions with the roles directly responsible for them and review the supporting evidence.';return `<div class="card action-hero"><h2>Sequenced action plan</h2><p class="muted">The action plan uses a four-step flow so priorities are easier to scan. Each recommendation is shown once and keeps the selected answer visible for traceability.</p><div class="stage-flow"><div class="stage-step" style="--stage:#66564c"><span class="num">1</span><strong>Confirm</strong><span>Validate the weakest findings with the right people and evidence.</span></div><div class="stage-arrow" aria-hidden="true">→</div><div class="stage-step" style="--stage:#786258"><span class="num">2</span><strong>${esc(s.title2)}</strong><span>Act first on the most immediate priority conditions.</span></div><div class="stage-arrow" aria-hidden="true">→</div><div class="stage-step" style="--stage:#876d64"><span class="num">3</span><strong>Strengthen next</strong><span>Address the next most relevant development conditions.</span></div><div class="stage-arrow" aria-hidden="true">→</div><div class="stage-step" style="--stage:#947a71"><span class="num">4</span><strong>Reassess</strong><span>Check whether the evidence and scores actually change.</span></div></div></div><div class="timeline"><div class="stage-card" style="--stage:#66564c"><div class="stage-titlebar"><span class="stage-num">1</span><h3>Confirm</h3></div><div class="stage-body"><p class="stage-intro">Before changing responsibilities or processes, confirm the most important weak findings with the relevant roles and supporting evidence.</p><p>${esc(confirmRoles)}</p>${s.confirm.length?`<ul class="confirm-items">${s.confirm.map(id=>`<li>${esc(Q[id].title)} (${id}) · rating ${result.answers[id]}</li>`).join('')}</ul>`:'<p>No critical rating requires additional confirmation beyond the normal evidence review.</p>'}</div></div><div class="stage-card" style="--stage:#786258"><div class="stage-titlebar"><span class="stage-num">2</span><h3>${esc(s.title2)}</h3></div><div class="stage-body"><p class="stage-intro">These are the most immediate conditions to improve first.</p><div class="action-stack">${s.act.map(id=>recCard(id,result)).join('')}</div></div></div>${s.next.length?`<div class="stage-card" style="--stage:#876d64"><div class="stage-titlebar"><span class="stage-num">3</span><h3>Strengthen next</h3></div><div class="stage-body"><p class="stage-intro">After the main priorities, strengthen the next set of conditions that support broader adoption.</p><div class="action-stack">${s.next.map(id=>recCard(id,result)).join('')}</div></div></div>`:''}<div class="stage-card" style="--stage:#947a71"><div class="stage-titlebar"><span class="stage-num">4</span><h3>Reassess</h3></div><div class="stage-body"><p class="stage-intro">Agree what evidence should look different after action is taken, then reassess the same scope.</p><p>Assign a named person or role to each agreed action and agree the evidence that should change. Repeat the assessment for the same scope after the agreed period or an important organisational change.</p><p class="small muted">A different score may reflect genuine improvement, different respondents, new evidence, or a different understanding of the questions. Compare the basis of the answers as well as the scores.</p></div></div></div>`}
function resultsScreen(){const result=computeAssessment(state.ctx,state.answers,state.notes);let body=state.tab==='profile'?profileTab(result):state.tab==='interactions'?interactionsTab(result):state.tab==='actions'?actionsTab(result):state.tab==='method'?methodTab(result):overviewTab(result);return `<div class="card no-print"><div class="between"><div><div class="eyebrow">7 · Results</div><h2 style="margin-bottom:0">AI Adoption Diagnostic</h2></div><div class="row"><button class="btn sm" data-report="download">Download report HTML</button><button class="btn sm" data-export="json">Export JSON</button><button class="btn sm primary" data-print="1">Print / save PDF</button></div></div></div>${resultTabs()}${body}<div class="card no-print between"><button class="btn" data-go="6">Back to review</button><button class="btn" data-reset="1">Start a new assessment</button></div>`}
function render(){const app=document.getElementById('app');const screens=[startScreen,contextScreen,()=>dimScreen(0),()=>dimScreen(1),()=>dimScreen(2),()=>dimScreen(3),reviewScreen,resultsScreen];app.innerHTML=`<div class="topbar"><div><span class="brand">AI Adoption Diagnostic</span> <span class="version">V${APP_VERSION}</span></div><span class="tiny muted">Exploratory decision-support prototype</span></div>${rail()}${screens[state.stage]?screens[state.stage]():startScreen()}`;bind();}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setState({stage:+b.dataset.go}));document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>loadDemo());document.querySelectorAll('[data-ctx]').forEach(el=>el.onchange=()=>{state.ctx[el.dataset.ctx]=el.value;save()});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{state.answers[b.dataset.answer]=b.dataset.value==='ns'?'ns':+b.dataset.value;save();render()});document.querySelectorAll('[data-note]').forEach(el=>el.onchange=el.oninput=()=>{const id=el.dataset.note,field=el.dataset.field;state.notes[id]=state.notes[id]||{};state.notes[id][field]=el.value;save()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setState({tab:b.dataset.tab}));document.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>{state.pair=b.dataset.pair;save();render();requestAnimationFrame(()=>{const el=document.getElementById('interaction-detail');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})})});document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printReport());document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>downloadReport());document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportJSON());document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{if(confirm('Clear this assessment and start again?')){state=defaultState();save();render()}});document.querySelectorAll('[data-runtests]').forEach(b=>b.onclick=()=>showTests());}
function loadDemo(){state=defaultState();state.ctx={scope:'Individual AI use case',mode:'Individual perspective',role:'Operational employee',size:'1–9 employees',sector:'Technology or software',sensitivity:'Low',stage:'Continuous improvement',orgStage:'Scaling across several functions',use:'Customer service or sales',contributors:'1',docsReviewed:'No'};const vals={C1:3,C2:1,C3:3,C4:3,C5:3,E1:3,E2:3,E3:3,E4:2,E5:3,L1:3,L2:3,L3:3,L4:0,L5:1,S1:3,S2:1,S3:3,S4:4,S5:0};state.answers=vals;state.stage=7;save();render();}
function fullReportHTML(result){const interactions=result.interactions.map(c=>interactionDetail(c,result)).join('');return `<div class="report"><div class="report-section card"><div class="eyebrow">AI Adoption Diagnostic · V${APP_VERSION}</div><h1>Assessment report</h1><p class="muted">Exploratory decision-support prototype. Results apply only to the selected assessment scope.</p><h2>Main finding</h2><p>${esc(mainFinding(result))}</p><div class="callout ${result.evidence.label==='Limited'?'warn':''}"><strong>Evidence basis: ${result.evidence.label}.</strong> ${esc(result.evidence.basis)}.${result.evidence.label==='Limited'?' Confirm important findings with other relevant roles or supporting evidence before changing responsibilities or processes.':''}</div></div><div class="report-section">${scoreCards(result)}</div><div class="report-section grid2"><div class="card"><h2>Context and overall pattern</h2><p>${esc(overallPattern(result))}</p><div class="kv small">${Object.entries(result.ctx).filter(([,v])=>v).map(([k,v])=>`<dt>${esc((CONTEXT.find(x=>x.id===k)||{label:k}).label)}</dt><dd>${esc(v)}</dd>`).join('')}</div></div>${valueCard(result)}</div><div class="report-section"><h2>Question-level profile</h2><div class="grid2">${DIMENSIONS.map(d=>qprofile(d,result)).join('')}</div></div><div class="report-section page-break"><h2>Interaction analysis</h2><p class="small muted">All six relationships use the Chapter 6 question subsets. The statements below describe patterns in the entered answers and do not claim causality.</p>${interactions}</div><div class="report-section page-break"><h2>Action plan</h2>${actionsTab(result)}</div><div class="report-section page-break"><h2>Methodology and responsible use</h2>${methodologyHTML()}<div class="card"><p><strong>Responsible use.</strong> This framework is an exploratory decision-support prototype based on a literature synthesis and 18 qualitative interviews. It is not a certification of AI readiness, a legal or regulatory assessment, a compliance audit, or a statistically validated prediction of adoption success. A single respondent should not be assumed to represent an entire organisation. Important decisions should be supported with additional roles, documents, operational measures, and stakeholder discussion.</p></div></div></div>`;}
function renderReport(){const result=computeAssessment(state.ctx,state.answers,state.notes);document.getElementById('report-root').innerHTML=fullReportHTML(result);return result;}
function printReport(){renderReport();setTimeout(()=>window.print(),50)}
function buildStandaloneReport(){const result=computeAssessment(state.ctx,state.answers,state.notes);const css=document.getElementById('app-style').textContent;return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Adoption Diagnostic Report</title><style>${css}</style><style>.report-only{display:block!important}.screen-only{display:none!important}#report-root{display:block!important}.report{max-width:1120px;margin:0 auto;padding:20px}</style></head><body><div id="report-root" class="report-only">${fullReportHTML(result)}</div></body></html>`;}
function download(name,text,type='text/html'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},50)}
function downloadReport(){download('AI_Adoption_Diagnostic_V2_Report.html',buildStandaloneReport())}
function exportPayload(){const result=computeAssessment(state.ctx,state.answers,state.notes);return{tool:'AI Adoption Diagnostic',version:APP_VERSION,exportedAt:new Date().toISOString(),methodology:methodologyModel(),config:CONFIG,assessment:{context:state.ctx,answers:state.answers,notes:state.notes},results:{scores:result.scores,priority:result.priority,interactions:result.interactions.map(c=>({key:c.key,aScore:c.aScore,bScore:c.bScore,classification:c.classification,aFallback:c.aFallback,bFallback:c.bFallback})),value:result.value,evidence:result.evidence,sequence:result.sequence}};}
function exportJSON(){download('AI_Adoption_Diagnostic_V2.json',JSON.stringify(exportPayload(),null,2),'application/json')}

// ---------------- Deterministic regression tests ----------------
function A(defaultRating=2,overrides={}){const a={};QUESTIONS.forEach(q=>a[q.id]=defaultRating);return Object.assign(a,overrides)}
function testCtx(broad=false){return{scope:'Individual AI use case',mode:broad?'Evidence-based organisational review':'Individual perspective',role:'Project or product manager',size:'250–999 employees',sector:'Technology or software',sensitivity:'Moderate',stage:'Running a pilot',orgStage:'Running pilots',use:'Process automation',contributors:broad?'4 or more':'1',docsReviewed:broad?'Yes':'No'}}
function runRegressionTests(){const tests=[],t=(name,fn)=>{try{tests.push({name,pass:!!fn()})}catch(e){tests.push({name,pass:false,error:e.message})}};
 t('1 all 20 questions produce four valid scores',()=>Object.values(allDimensionScores(A(2))).every(x=>x===50));
 t('2 missing answers are excluded rather than imputed',()=>{const a=A(2);delete a.C1;return dimensionScore('culture',a)===50});
 t('3 minimum three-answer rule',()=>{const a=A(2);delete a.C1;delete a.C2;delete a.C3;return dimensionScore('culture',a)===null});
 t('4 equal dimension-score ties stay in one group',()=>priorityAnalysis(allDimensionScores(A(2)),A(2)).group.length===4);
 t('5 equal lowest question ratings remain same first tier',()=>{const a=A(3,{L4:0,L5:0});const r=computeAssessment(testCtx(),a);return r.sequence.act.includes('L4')&&r.sequence.act.includes('L5')});
 t('6 L4, S2 and S5 equal lowest all remain in first tier',()=>{const a=A(3,{L1:2,L2:2,L3:2,L4:0,L5:2,S1:3,S2:0,S3:3,S4:3,S5:0});const r=computeAssessment(testCtx(),a);return ['L4','S2','S5'].every(id=>r.sequence.act.includes(id))});
 t('7 L4 weak with L1 strong does not become strategic-direction claim',()=>{const a=A(3,{L4:0,L1:4});const r=computeAssessment(testCtx(),a);const rec=recommendationFor('L4',0,r.ctx,r.evidence);return /business outcome|business owner/i.test(rec.action)&&!/strategic direction is weak/i.test(rec.finding+rec.action)});
 t('8 L5 weak with L1 strong remains cross-level accountability',()=>{const a=A(3,{L5:0,L1:4});const r=computeAssessment(testCtx(),a);return /senior leadership|managers|operational teams/i.test(recommendationFor('L5',0,r.ctx,r.evidence).action)});
 t('9 S2/S5 weak but S1/S3 strong does not claim data/systems weak',()=>{const a=A(3,{S1:4,S2:0,S3:4,S5:0});const r=computeAssessment(testCtx(),a);const c=r.interactions.find(x=>x.key==='culture|structure');const txt=interactionText(c,a,r.scores,r.ctx,r.evidence);return !/data are weak|systems are weak|data, systems.*weak/i.test(txt.show+' '+txt.where)});
 t('10 C2/C5 weak but C4 strong does not claim participation weak',()=>{const a=A(3,{C2:0,C5:0,C4:4});const r=computeAssessment(testCtx(),a);const c=r.interactions.find(x=>x.key==='culture|expectations');const txt=interactionText(c,a,r.scores,r.ctx,r.evidence);return !/participation is weak|employee participation is weak/i.test(txt.show+' '+txt.where)});
 t('11 no-clear interaction cannot produce directional wording',()=>{const a=A(3,{E1:'ns',E2:'ns',E3:'ns',E4:'ns',E5:'ns'});const r=computeAssessment(testCtx(),a);const c=r.interactions.find(x=>x.key==='culture|expectations');const txt=interactionText(c,a,r.scores,r.ctx,r.evidence);return c.classification==='No clear interaction'&&!/ahead of|translated into|stronger within/i.test(txt.show)});
 t('12 interaction classification matches Chapter 6 cases',()=>{const rein=computeAssessment(testCtx(),A(3)).interactions.every(x=>x.classification==='Mutually reinforcing');const constr=computeAssessment(testCtx(),A(1)).interactions.every(x=>x.classification==='Mutually constraining');const a=A(3,{L3:0,L4:0,L5:0});const c=computeAssessment(testCtx(),a).interactions.find(x=>x.key==='leadership|structure');return rein&&constr&&['One area ahead of the other','Partially reinforcing / uneven'].includes(c.classification)});
 t('13 methodology screen uses the active methodology model',()=>methodologyHTML().includes(esc(methodologyModel().scoring)));
 t('14 report uses the same methodology model',()=>{const r=computeAssessment(testCtx(),A(2));return fullReportHTML(r).includes(esc(methodologyModel().interaction))});
 t('15 JSON export uses the same methodology model',()=>JSON.stringify(exportPayload().methodology)===JSON.stringify(methodologyModel()));
 t('16 duplicate recommendation action detection',()=>{const acts=QUESTIONS.map(q=>REC[q.id].actions[0]);return new Set(acts).size===acts.length});
 t('17 L4/L5/S5 advice is conceptually distinct',()=>{const x=['L4','L5','S5'].map(id=>REC[id].actions[0].toLowerCase());return x[0].includes('business outcome')&&x[1].includes('senior leadership')&&x[2].includes('data, system, workflow')&&new Set(x).size===3});
 t('18 rating 0/1/2 produces different advice for same question',()=>new Set([0,1,2].map(v=>REC.L4.actions[v])).size===3);
 t('19 singular/plural critical-gap wording',()=>{const r1=computeAssessment(testCtx(),A(3,{L4:0})),r2=computeAssessment(testCtx(),A(3,{L4:0,S5:0}));return /One critical question-level gap/.test(mainFinding(r1))&&/There are 2 critical question-level gaps/.test(mainFinding(r2))});
 t('20 limited-evidence wording is cautious',()=>/suggests|may|Confirm/.test(recommendationFor('L4',0,testCtx(),evidenceBasis(testCtx())).finding));
 t('21 stronger-evidence wording is not unnecessarily hesitant',()=>{const e=evidenceBasis(testCtx(true)),f=recommendationFor('L4',0,testCtx(true),e).finding;return /recorded assessment indicates/i.test(f)&&!/may currently|may be/.test(f)});
 t('22 generated interpretations avoid unsupported causal wording',()=>{const r=computeAssessment(testCtx(),A(2,{L4:0,S5:0}));const all=r.interactions.map(c=>Object.values(interactionText(c,r.answers,r.scores,r.ctx,r.evidence)).join(' ')).join(' ');return !/\bcauses\b|will solve|holding .* back/i.test(all)});
 t('23 normal user labels do not require academic terminology',()=>DIMENSIONS.every(d=>!['Cultural alignment','Expectation–capability dynamics','Leadership engagement','Structural enablement'].includes(d.label)));
 t('24 compact print policy is active',()=>document.getElementById('app-style').textContent.includes('@page{size:A4;margin:11mm}')&&!document.getElementById('app-style').textContent.includes('break-before:page}.report .rec-card'));
 t('25 calculation and report scores are internally consistent',()=>{const a=A(2,{C1:4,L4:0,S5:1});const r=computeAssessment(testCtx(),a);const h=fullReportHTML(r);return DIM_ORDER.every(d=>r.scores[d]==null||h.includes(String(r.scores[d])))});
 // language quality
 t('26 recommendation sentences remain readable in length',()=>{const s=Object.values(REC).flatMap(r=>[r.why,...r.actions]);return s.every(x=>Math.max(...x.split(/[.!?]/).map(y=>y.trim().split(/\s+/).filter(Boolean).length),0)<=55)});
 t('27 no generic slogan-only actions',()=>Object.values(REC).flatMap(r=>r.actions).every(x=>!/^(Strengthen collaboration|Improve accountability|Drive alignment|Enhance AI readiness|Build a culture of innovation)\.?$/i.test(x.trim())));
 t('28 recommendation sentences are not dominated by comma lists',()=>Object.values(REC).flatMap(r=>r.actions).every(x=>(x.match(/,/g)||[]).length<=5));
 t('29 interaction evidence IDs are always part of the relationship subset',()=>{const r=computeAssessment(testCtx(),A(2,{L4:0,S5:0}));return r.interactions.every(c=>interactionText(c,r.answers,r.scores,r.ctx,r.evidence).basedOn.every(id=>c.aIds.includes(id)||c.bIds.includes(id)))});
 t('30 related critical gaps outside the priority group remain visible',()=>{const a=A(3,{L4:0,L5:1,S2:1,S5:0,C2:1,C1:3,C3:3,C4:3,C5:3,E1:3,E2:3,E3:3,E4:3,E5:3,S1:3,S3:3,S4:3,L1:3,L2:3,L3:3});const r=computeAssessment(testCtx(),a);return r.priority.related.includes('culture')});
 return tests;}
function showTests(){const out=document.getElementById('test-output'),tests=runRegressionTests();if(out)out.innerHTML=`<p><strong>${tests.filter(x=>x.pass).length}/${tests.length} tests passed.</strong></p><ol>${tests.map(x=>`<li class="${x.pass?'test-pass':'test-fail'}">${x.pass?'PASS':'FAIL'} · ${esc(x.name)}${x.error?' — '+esc(x.error):''}</li>`).join('')}</ol>`;return tests;}
window.AIDiagnosticV2={CONFIG,DIMENSIONS,QUESTIONS,PAIRS,computeAssessment,runRegressionTests,loadDemo,renderReport,buildStandaloneReport,methodologyModel,setStateForTest:(s)=>{state={...defaultState(),...s};save();render()},getState:()=>state,exportPayload};
render();
if(new URLSearchParams(location.search).get('demo')==='1'){loadDemo();if(new URLSearchParams(location.search).get('print')==='1')renderReport();}
</script>
